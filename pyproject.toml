[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covidmkt"
version = "1.0.0"
description = "Cross-asset impact of COVID-19: regimes, contagion tests, GJR-GARCH, Diebold-Yilmaz spillovers and stress testing"
authors = [{ name = "Dr. Muhammad Imran Bhatti" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "statsmodels>=0.14", "arch>=6.0"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8", "seaborn>=0.13", "yfinance>=0.2.40", "jupyter"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
